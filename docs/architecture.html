<!doctype html>
<html><head><meta charset="utf-8"><title>First Share architecture</title>
<style>
  body { margin:0; background:#fbf7ef; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; color:#23302a; }
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d7a72"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fbf7ef"/>
  <text x="80" y="90" font-family="Georgia, serif" font-size="46">First Share — architecture</text>
  <text x="80" y="130" font-size="20" fill="#6d7a72">Next.js on Vercel · Base Sepolia · every trade signed by the kid's Dynamic wallet</text>

  <!-- parent -->
  <rect x="80" y="200" width="300" height="130" rx="22" fill="#fff" stroke="#23302a" stroke-opacity=".12"/>
  <text x="105" y="245" font-size="26" font-family="Georgia, serif">Parent</text>
  <text x="105" y="280" font-size="17" fill="#6d7a72">sets the rule · adds to the jar</text>
  <text x="105" y="306" font-size="15" fill="#2f6b4f">/parent → POST /api/rule</text>

  <!-- agent -->
  <rect x="520" y="200" width="420" height="300" rx="22" fill="#fff" stroke="#2f6b4f" stroke-width="2"/>
  <text x="545" y="245" font-size="26" font-family="Georgia, serif">Friday agent  (lib/agent.ts)</text>
  <text x="545" y="290" font-size="17">1  read market price + week</text>
  <text x="545" y="322" font-size="17">2  apply the rule → buy / skip</text>
  <text x="545" y="354" font-size="17">3  price on Uniswap, refuse if drift &gt; 3%</text>
  <text x="545" y="386" font-size="17">4  approve (once) + swap</text>
  <text x="545" y="430" font-size="15" fill="#6d7a72">deterministic: no model decides</text>
  <text x="545" y="455" font-size="15" fill="#6d7a72">how a child's money is spent</text>
  <text x="545" y="480" font-size="15" fill="#2f6b4f">POST /api/run → NDJSON stream</text>

  <!-- market -->
  <rect x="1080" y="180" width="440" height="110" rx="22" fill="#fff" stroke="#23302a" stroke-opacity=".12"/>
  <text x="1105" y="225" font-size="24" font-family="Georgia, serif">Real market</text>
  <text x="1105" y="258" font-size="16" fill="#6d7a72">Yahoo Finance · last close + 5-day move</text>

  <!-- uniswap -->
  <rect x="1080" y="330" width="440" height="250" rx="22" fill="#fff" stroke="#ff4fa3" stroke-width="2"/>
  <text x="1105" y="375" font-size="24" font-family="Georgia, serif">Uniswap v4  (lib/uniswap.ts)</text>
  <text x="1105" y="410" font-size="16">V4Quoter.quoteExactInputSingle — what $X buys</text>
  <text x="1105" y="438" font-size="16">StateView.getSlot0 — pool price vs market</text>
  <text x="1105" y="466" font-size="16">Permit2 → UniversalRouter allowances</text>
  <text x="1105" y="494" font-size="16">UniversalRouter.execute(V4_SWAP)</text>
  <text x="1105" y="522" font-size="15" fill="#6d7a72">SWAP_EXACT_IN_SINGLE · SETTLE_ALL · TAKE_ALL</text>
  <text x="1105" y="556" font-size="15" fill="#6d7a72">3 pools: fsAAPL / fsNVDA / fsVOO vs fsUSD, 0.3%</text>

  <!-- dynamic -->
  <rect x="520" y="570" width="420" height="160" rx="22" fill="#fff" stroke="#2f6b4f" stroke-width="2"/>
  <text x="545" y="615" font-size="24" font-family="Georgia, serif">Dynamic server wallet</text>
  <text x="545" y="648" font-size="16">the kid's wallet · 2-of-2 MPC · API-token auth</text>
  <text x="545" y="676" font-size="16">signTransaction → broadcast → receipt</text>
  <text x="545" y="706" font-size="15" fill="#2f6b4f">lib/signer.ts</text>

  <!-- chain -->
  <rect x="1080" y="630" width="440" height="100" rx="22" fill="#23302a"/>
  <text x="1105" y="672" font-size="24" font-family="Georgia, serif" fill="#fbf7ef">Base Sepolia</text>
  <text x="1105" y="704" font-size="16" fill="#cfd8d2">PoolManager · shares land in the kid's wallet</text>

  <!-- setup -->
  <rect x="80" y="420" width="300" height="160" rx="22" fill="#fff" stroke="#23302a" stroke-opacity=".12" stroke-dasharray="6 6"/>
  <text x="105" y="462" font-size="22" font-family="Georgia, serif">One-time setup</text>
  <text x="105" y="494" font-size="15" fill="#6d7a72">scripts/setup-chain.mjs</text>
  <text x="105" y="522" font-size="15">deploy test tokens · initializePool</text>
  <text x="105" y="548" font-size="15">modifyLiquidities (MINT_POSITION)</text>

  <!-- kid view -->
  <rect x="80" y="630" width="300" height="100" rx="22" fill="#fff" stroke="#23302a" stroke-opacity=".12"/>
  <text x="105" y="672" font-size="22" font-family="Georgia, serif">Kid's garden  /</text>
  <text x="105" y="702" font-size="15" fill="#6d7a72">holdings read from chain</text>

  <path d="M380 265 H510" stroke="#6d7a72" stroke-width="2" marker-end="url(#a)"/>
  <path d="M940 250 H1070" stroke="#6d7a72" stroke-width="2" marker-end="url(#a)"/>
  <path d="M940 420 H1070" stroke="#6d7a72" stroke-width="2" marker-end="url(#a)"/>
  <path d="M730 500 V560" stroke="#6d7a72" stroke-width="2" marker-end="url(#a)"/>
  <path d="M940 650 C 1000 650, 1010 600, 1070 560" stroke="#6d7a72" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M1300 580 V620" stroke="#6d7a72" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380 500 C 700 520, 900 560, 1070 470" stroke="#6d7a72" stroke-width="1.5" stroke-dasharray="5 6" fill="none" marker-end="url(#a)"/>
  <path d="M1300 730 V775 H230 V740" stroke="#6d7a72" stroke-width="1.5" stroke-dasharray="5 6" fill="none" marker-end="url(#a)"/>

  <text x="80" y="840" font-size="16" fill="#6d7a72">Testnet: fsAAPL, fsNVDA, fsVOO are tokenized stand-ins priced from real quotes; fsUSD is test money. None are securities.</text>
</svg>
</body></html>
